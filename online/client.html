<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#070b1a"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><link rel="apple-touch-icon" href="icon-192.png"><title>Neon Pong Online</title>
<style>
:root{--bg:#070b1a;--fg:#e8f0ff;--p1:#22d3ee;--p2:#f472b6;--card:#111936;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#070b1a}}
:root[data-theme="dark"]{--bg:#070b1a}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:var(--bg);color:var(--fg);overflow:hidden;touch-action:none;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-user-select:none;user-select:none}
#wrap{position:relative;height:100%;display:flex;align-items:center;justify-content:center}
canvas{display:block;touch-action:none}
#ov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(7,11,26,.88);overflow-y:auto}
.card{width:min(340px,92%);text-align:center;padding:14px}
h1{margin:0;font-size:34px;letter-spacing:2px;background:linear-gradient(90deg,var(--p1),var(--p2));-webkit-background-clip:text;background-clip:text;color:transparent}
h2{margin:6px 0}
p{margin:6px 0;font-size:13px;opacity:.85}
button{display:block;width:100%;margin:8px 0;padding:13px;border:0;border-radius:12px;background:var(--card);color:var(--fg);font-size:16px;font-weight:700;border:2px solid #2c3a78}
button b{display:block;font-size:11px;font-weight:400;opacity:.7}
button:active{transform:scale(.97);border-color:var(--p1)}
.g{border-color:#fbbf24}
input{display:block;width:100%;margin:8px 0;padding:13px;border:0;border-radius:12px;background:var(--card);color:var(--fg);font-size:16px;font-weight:700;border:2px solid #2c3a78;text-align:center;box-sizing:border-box}
input:focus{outline:none;border-color:var(--p1)}
table{width:100%;font-size:14px;border-collapse:collapse;margin:8px 0}td{padding:3px}
.status{padding:8px;border-radius:8px;margin:8px 0;font-size:14px;font-weight:700}
.status.waiting{background:#1e3a5f;color:#60a5fa}
.status.ready{background:#1e3a2f;color:#34d399}
.status.error{background:#3a1e1e;color:#f87171}
</style></head><body><div id="wrap"><canvas id="c"></canvas><div id="ov"></div></div>
<script>
const W=360,H=640,R=7,cv=document.getElementById('c'),ctx=cv.getContext('2d'),ov=document.getElementById('ov');
cv.width=W*2;cv.height=H*2;ctx.scale(2,2);
function fit(){const s=Math.min(innerWidth/W,innerHeight/H);cv.style.width=W*s+'px';cv.style.height=H*s+'px'}
addEventListener('resize',fit);fit();
const C=['#22d3ee','#f472b6'];

// Game state
let G = { state: 'menu' };
let ws = null;
let playerNumber = 0;
let roomCode = '';
let gameState = null;
let opponentPaddle = 0;
let lastPaddleSent = 0;

// Audio
let AC;
function snd(f,d,t){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type=t||'square';o.frequency.value=f;g.gain.value=.05;o.connect(g);g.connect(AC.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+d);o.stop(AC.currentTime+d)}catch(e){}}

// Menu
function menu(){
  G = { state: 'menu' };
  ov.style.display = 'flex';
  ov.innerHTML = `<div class="card">
    <h1>NEON PONG</h1>
    <p>Online multiplayer</p>
    <input type="text" id="roomInput" placeholder="Room code (e.g. ABC123)" maxlength="8">
    <button onclick="joinRoom()">Join / Create Room</button>
    <button onclick="quickMatch()">Quick Match</button>
    <p>Share the room code with a friend to play together!</p>
  </div>`;
}

function quickMatch(){
  const code = Math.random().toString(36).substring(2, 8).toUpperCase();
  document.getElementById('roomInput').value = code;
  joinRoom();
}

function joinRoom(){
  const input = document.getElementById('roomInput');
  roomCode = (input.value || '').toUpperCase().trim();
  if (!roomCode) {
    alert('Please enter a room code');
    return;
  }
  
  const wsUrl = `wss://neon-pong-online.brettanthonysjoberg179.workers.dev/ws?room=${roomCode}`;
  
  showStatus('Connecting...', 'waiting');
  
  try {
    ws = new WebSocket(wsUrl);
  } catch(e) {
    showStatus('Connection failed: ' + e.message, 'error');
    return;
  }
  
  ws.onopen = () => {
    showStatus('Connected! Waiting for opponent...', 'waiting');
  };
  
  ws.onmessage = (event) => {
    try {
      const data = JSON.parse(event.data);
      handleServerMessage(data);
    } catch(e) {
      console.error('Bad message:', e);
    }
  };
  
  ws.onclose = () => {
    showStatus('Disconnected. Refresh to reconnect.', 'error');
    G.state = 'menu';
  };
  
  ws.onerror = (e) => {
    showStatus('Connection error', 'error');
  };
}

function showStatus(msg, type){
  ov.innerHTML = `<div class="card">
    <h1>NEON PONG</h1>
    <div class="status ${type}">${msg}</div>
    <p>Room: ${roomCode}</p>
    <button onclick="leaveRoom()">Leave</button>
  </div>`;
}

function leaveRoom(){
  if (ws) ws.close();
  menu();
}

function handleServerMessage(data){
  switch(data.type){
    case 'connected':
      playerNumber = data.playerNumber;
      showStatus(`You are Player ${playerNumber}. Waiting for opponent...`, 'waiting');
      break;
    case 'start':
      showStatus('Opponent found! Get ready...', 'ready');
      setTimeout(() => {
        startGame();
      }, 1500);
      break;
    case 'game_start':
      gameState = data.state;
      G.state = 'play';
      ov.style.display = 'none';
      break;
    case 'opponent_left':
      showStatus('Opponent left the game.', 'error');
      G.state = 'menu';
      break;
    case 'error':
      showStatus(data.message, 'error');
      break;
  }
}

function startGame(){
  G = {
    state: 'play',
    ball: { x: W/2, y: H/2, vx: 0, vy: 0, sp: 300 },
    paddles: [W/2, W/2],
    scores: [0, 0],
    rally: 0,
    serve: 0,
    cd: 1.3,
    over: false
  };
  ov.style.display = 'none';
  launch();
}

function launch(){
  const a = (Math.random() - 0.5) * 0.9;
  G.ball.vx = G.ball.sp * Math.sin(a);
  G.ball.vy = (G.serve === 0 ? 1 : -1) * G.ball.sp * Math.cos(a);
}

// Input
const ptr = {};
function lp(e){
  const r = cv.getBoundingClientRect();
  return [(e.clientX - r.left) / r.width * W, (e.clientY - r.top) / r.height * H];
}

cv.addEventListener('pointerdown', e => {
  if (G.state !== 'play') return;
  const [x, y] = lp(e);
  ptr[e.pointerId] = true;
  G.paddles[playerNumber - 1] = x;
  sendPaddle(x);
  try { cv.setPointerCapture(e.pointerId); } catch(_){}
});

cv.addEventListener('pointermove', e => {
  if (!ptr[e.pointerId] || G.state !== 'play') return;
  const [x, y] = lp(e);
  G.paddles[playerNumber - 1] = x;
  sendPaddle(x);
});

['pointerup','pointercancel'].forEach(n => cv.addEventListener(n, e => { delete ptr[e.pointerId]; }));

function sendPaddle(x){
  if (!ws || ws.readyState !== WebSocket.OPEN) return;
  const now = performance.now();
  if (now - lastPaddleSent < 16) return; // ~60fps max
  lastPaddleSent = now;
  ws.send(JSON.stringify({ type: 'paddle', value: x }));
}

// Game loop
let lt = performance.now();
function loop(t){
  const dt = Math.min(0.033, (t - lt) / 1000);
  lt = t;
  if (G.state === 'play') upd(dt);
  draw();
  requestAnimationFrame(loop);
}

function upd(dt){
  if (!G || G.over) return;
  
  const b = G.ball;
  
  // Cooldown
  if (G.cd > 0) {
    G.cd -= dt;
    if (G.cd <= 0) launch();
    return;
  }
  
  // Move ball
  b.x += b.vx * dt;
  b.y += b.vy * dt;
  
  // Wall bounces
  if (b.x < R) { b.x = R; b.vx = Math.abs(b.vx); snd(300, 0.03); }
  if (b.x > W - R) { b.x = W - R; b.vx = -Math.abs(b.vx); snd(300, 0.03); }
  
  // Paddle collisions
  const pw = 76;
  for (let i = 0; i < 2; i++) {
    const py = i === 0 ? H - 70 : 70;
    const px = G.paddles[i];
    const isBottom = i === 0;
    
    if (isBottom && b.vy > 0 && b.y + R >= py - 6 && b.y < py + 12 && Math.abs(b.x - px) <= pw/2 + R) {
      hit(i, px, pw, py);
    } else if (!isBottom && b.vy < 0 && b.y - R <= py + 6 && b.y > py - 12 && Math.abs(b.x - px) <= pw/2 + R) {
      hit(i, px, pw, py);
    }
  }
  
  // Goals
  if (b.y < -12) {
    goal(1);
  } else if (b.y > H + 12) {
    goal(0);
  }
}

function hit(i, px, pw, py){
  const b = G.ball;
  const off = Math.max(-1, Math.min(1, (b.x - px) / (pw/2)));
  const sp = Math.min(b.sp * 1.035, 540);
  const a = off * 0.95;
  
  snd(i === 0 ? 440 : 520, 0.05);
  G.rally++;
  b.vx = sp * Math.sin(a);
  b.vy = (i === 0 ? -1 : 1) * Math.abs(sp * Math.cos(a));
  b.y = i === 0 ? py - 6 - R : py + 6 + R;
  
  if (G.rally % 5 === 0) {
    snd(660, 0.1, 'triangle');
  }
}

function goal(playerIdx){
  const b = G.ball;
  G.scores[playerIdx]++;
  snd(180, 0.3, 'sawtooth');
  G.serve = 1 - playerIdx;
  
  if (G.scores[playerIdx] >= 5) {
    endGame(playerIdx);
  } else {
    b.x = W/2; b.y = H/2; b.vx = 0; b.vy = 0;
    G.rally = 0;
    G.cd = 1.2;
  }
}

function endGame(winner){
  G.over = true;
  G.state = 'between';
  ov.style.display = 'flex';
  const youWon = (winner + 1) === playerNumber;
  ov.innerHTML = `<div class="card">
    <h1 style="color:${C[winner]}">${youWon ? 'YOU WIN!' : 'YOU LOSE'}</h1>
    <p>Final Score: ${G.scores[0]} - ${G.scores[1]}</p>
    <button class="g" onclick="rematch()">Rematch</button>
    <button onclick="leaveRoom()">Menu</button>
  </div>`;
}

function rematch(){
  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify({ type: 'restart' }));
  }
  startGame();
}

// Drawing
function draw(){
  ctx.clearRect(0, 0, W, H);
  
  if (G.state === 'menu' || !G.ball) {
    ctx.fillStyle = '#070b1a';
    ctx.fillRect(0, 0, W, H);
    return;
  }
  
  // Background
  const gr = ctx.createLinearGradient(0, 0, 0, H);
  gr.addColorStop(0, '#070b1a');
  gr.addColorStop(0.5, '#22d3ee22');
  gr.addColorStop(1, '#070b1a');
  ctx.fillStyle = gr;
  ctx.fillRect(0, 0, W, H);
  
  // Center line
  ctx.strokeStyle = '#22d3ee';
  ctx.globalAlpha = 0.5;
  ctx.setLineDash([10, 10]);
  ctx.beginPath();
  ctx.moveTo(0, H/2);
  ctx.lineTo(W, H/2);
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.globalAlpha = 1;
  
  // Border
  ctx.lineWidth = 3;
  ctx.strokeRect(1, 1, W-2, H-2);
  ctx.lineWidth = 1;
  
  // Paddles
  const pw = 76;
  for (let i = 0; i < 2; i++) {
    const py = i === 0 ? H - 70 : 70;
    const px = G.paddles[i];
    ctx.fillStyle = C[i];
    ctx.shadowColor = C[i];
    ctx.shadowBlur = 10;
    ctx.fillRect(px - pw/2, py - 6, pw, 12);
    ctx.shadowBlur = 0;
  }
  
  // Ball
  const b = G.ball;
  ctx.fillStyle = '#fff';
  ctx.shadowColor = '#fff';
  ctx.shadowBlur = 12;
  ctx.beginPath();
  ctx.arc(b.x, b.y, R, 0, 7);
  ctx.fill();
  ctx.shadowBlur = 0;
  
  // Scores
  ctx.textAlign = 'left';
  ctx.fillStyle = C[0];
  ctx.font = 'bold 44px system-ui';
  ctx.fillText(G.scores[0], 14, H/2 + 50);
  ctx.font = 'bold 13px system-ui';
  ctx.fillText('YOU', 16, H - 12);
  
  ctx.save();
  ctx.translate(W/2, H/2);
  ctx.rotate(Math.PI);
  ctx.translate(-W/2, -H/2);
  ctx.textAlign = 'left';
  ctx.fillStyle = C[1];
  ctx.font = 'bold 44px system-ui';
  ctx.fillText(G.scores[1], 14, H/2 + 50);
  ctx.font = 'bold 13px system-ui';
  ctx.fillText('OPP', 16, H - 12);
  ctx.restore();
  
  // Rally
  ctx.textAlign = 'left';
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 11px system-ui';
  ctx.globalAlpha = 0.8;
  ctx.fillText('RALLY ' + G.rally, W/2 - 30, H/2 - 8);
  ctx.globalAlpha = 1;
  
  // Countdown
  if (G.cd > 0 && !G.over) {
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 40px system-ui';
    ctx.textAlign = 'center';
    ctx.fillText(Math.ceil(G.cd), W/2, H/2 + 80);
  }
}

// Start
menu();
requestAnimationFrame(loop);
</script></body></html>
